<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register Restaurant</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    font-family: Arial;
    background: #f4f6f9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding:20px;
}

.card{
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(0,0,0,0.15);
    width: 450px;
    max-width: 100%;
}

h2, h3{
    margin-bottom: 10px;
}

input, select{
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border: 1px solid #ddd;
    border-radius: 5px;
    box-sizing:border-box;
}

button{
    width: 100%;
    padding: 12px;
    background: #0a7cff;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
}

button:hover{
    background: #095fcc;
}

.pm-row{
    display:flex;
    gap:8px;
    margin:8px 0;
}
.pm-row select{
    flex:0 0 130px;
    margin:0;
}
.pm-row input{
    flex:1;
    margin:0;
}
.pm-row .pm-remove{
    flex:0 0 auto;
    width:auto;
    padding:10px 14px;
    background:#dc3545;
    font-size:14px;
}
.pm-row .pm-remove:hover{
    background:#c82333;
}
.pm-add-btn{
    background:#28a745;
    margin-top:4px;
}
.pm-add-btn:hover{
    background:#218838;
}
</style>
</head>

<body>

<div class="card">

<h2>🍽 Register Restaurant</h2>

<form method="POST" onsubmit="return preparePaymentMethods()">

    <input name="name" placeholder="Restaurant Name" required>
    <input name="phone" placeholder="Phone Number">

    <input name="username" placeholder="Username" required>
    <input name="password" type="password" placeholder="Restaurant Login Password" required>
    <input name="kitchen_password" type="password" placeholder="Kitchen Password" required>

    <h3>🔐 Restaurant Admin Password</h3>
    <input name="restaurant_admin_password"
           type="password"
           placeholder="Restaurant Admin Password"
           required>

    <h3>👤 Restaurant Admin Info</h3>
    <input name="admin_name" placeholder="Admin Name">
    <input name="admin_email" placeholder="Admin Email">

    <h3>💵 Subscription Price</h3>
    <input name="price" placeholder="Example: 20" required>

    <h3>📅 Subscription Period</h3>
    <select name="months" required>
        <option value="3">3 Months</option>
        <option value="6">6 Months</option>
        <option value="12">1 Year</option>
    </select>

    <h3>📲 Payment Methods</h3>
    <div id="pmList">
        <div class="pm-row">
            <select class="pm-type">
                <option value="EVC Plus">EVC Plus</option>
                <option value="eDahab">eDahab</option>
                <option value="Sahal">Sahal</option>
                <option value="Golis">Golis</option>
                <option value="Premier Bank">Premier Bank</option>
                <option value="Cash">Cash</option>
                <option value="Other">Other</option>
            </select>
            <input class="pm-code" placeholder="Example: *789*657090*$#" required>
            <button type="button" class="pm-remove" onclick="removePaymentRow(this)" style="display:none;">✕</button>
        </div>
    </div>
    <button type="button" class="pm-add-btn" onclick="addPaymentRow()">➕ Add Another Payment Method</button>
    <input type="hidden" name="payment_methods_json" id="payment_methods_json">

    <button type="submit">Create Restaurant</button>

</form>

</div>

<script>
function addPaymentRow(){
    const list = document.getElementById("pmList");
    const row = document.createElement("div");
    row.className = "pm-row";
    row.innerHTML = `
        <select class="pm-type">
            <option value="EVC Plus">EVC Plus</option>
            <option value="eDahab">eDahab</option>
            <option value="Sahal">Sahal</option>
            <option value="Golis">Golis</option>
            <option value="Premier Bank">Premier Bank</option>
            <option value="Cash">Cash</option>
            <option value="Other">Other</option>
        </select>
        <input class="pm-code" placeholder="Example: *789*657090*$#" required>
        <button type="button" class="pm-remove" onclick="removePaymentRow(this)">✕</button>
    `;
    list.appendChild(row);
    updateRemoveButtons();
}

function removePaymentRow(btn){
    btn.closest(".pm-row").remove();
    updateRemoveButtons();
}

function updateRemoveButtons(){
    const rows = document.querySelectorAll("#pmList .pm-row");
    rows.forEach(row => {
        const removeBtn = row.querySelector(".pm-remove");
        removeBtn.style.display = rows.length > 1 ? "inline-block" : "none";
    });
}

function preparePaymentMethods(){
    const rows = document.querySelectorAll("#pmList .pm-row");
    const methods = [];
    rows.forEach(row => {
        const type = row.querySelector(".pm-type").value;
        const code = row.querySelector(".pm-code").value.trim();
        if(code) methods.push({ type, code });
    });
    if(methods.length === 0){
        alert("Please add at least one payment method");
        return false;
    }
    document.getElementById("payment_methods_json").value = JSON.stringify(methods);
    return true;
}
</script>

</body>
</html>
