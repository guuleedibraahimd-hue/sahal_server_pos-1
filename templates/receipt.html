//template for receipt.htmls
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receipt - {{ restaurant_name }}</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Courier New', Courier, monospace;
    background: #e8e8e8;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    min-height: 100vh;
}
.receipt-wrapper { position: relative; }
.receipt-top {
    width: 320px; height: 15px;
    background: radial-gradient(circle at 10px 0, #e8e8e8 6px, #fff 7px) 0 0 / 20px 15px repeat-x;
}
.receipt {
    width: 320px; background: #fff; padding: 20px 22px;
}
.receipt-bottom {
    width: 320px; height: 15px;
    background: radial-gradient(circle at 10px 15px, #e8e8e8 6px, #fff 7px) 0 0 / 20px 15px repeat-x;
}
.restaurant-name {
    font-size: 20px; font-weight: 900; text-align: center;
    letter-spacing: 3px; text-transform: uppercase; color: #111; margin-bottom: 2px;
}
.restaurant-sub {
    text-align: center; font-size: 10px; letter-spacing: 2px;
    color: #555; text-transform: uppercase; margin-bottom: 6px;
}
.restaurant-phone { text-align: center; font-size: 11px; color: #333; margin-bottom: 4px; }
.divider-double {
    border: none; border-top: 2px solid #111; border-bottom: 1px solid #111;
    height: 4px; margin: 8px 0;
}
.divider { border: none; border-top: 1px dashed #999; margin: 8px 0; }
.meta-row {
    display: flex; justify-content: space-between;
    font-size: 11px; color: #333; margin: 3px 0;
}
.invoice-title {
    text-align: center; font-size: 12px; font-weight: bold;
    letter-spacing: 2px; margin: 6px 0;
}
.col-headers {
    display: grid; grid-template-columns: 1fr 40px 55px 55px;
    font-size: 10px; font-weight: bold; letter-spacing: 1px;
    text-transform: uppercase; padding: 4px 0; color: #111;
}
.col-headers span:not(:first-child) { text-align: right; }
.item-row {
    display: grid; grid-template-columns: 1fr 40px 55px 55px;
    font-size: 11px; padding: 4px 0; color: #222; border-bottom: 1px dotted #ddd;
}
.item-row span:not(:first-child) { text-align: right; }
.item-name {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding-right: 4px; text-transform: capitalize;
}
.total-row {
    display: flex; justify-content: space-between;
    font-size: 11px; padding: 3px 0; color: #333;
}
.grand-total-row {
    display: flex; justify-content: space-between;
    font-size: 15px; font-weight: 900; padding: 6px 0; color: #000; letter-spacing: 1px;
}
.payment-box {
    background: #f7f7f7; border: 1px solid #ddd; border-radius: 4px;
    padding: 8px 10px; margin: 6px 0; text-align: center; font-size: 11px; color: #333;
}
.pay-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: #888; margin-bottom: 3px; }
.pay-code { font-size: 14px; font-weight: bold; color: #111; letter-spacing: 1px; }
.thank-you {
    text-align: center; font-size: 13px; font-weight: bold;
    letter-spacing: 3px; margin: 8px 0 2px; text-transform: uppercase;
}
.footer-note { text-align: center; font-size: 9px; color: #888; letter-spacing: 1px; margin-bottom: 6px; }
.powered { text-align: center; font-size: 9px; color: #aaa; letter-spacing: 1px; margin-top: 4px; }
.barcode-area { text-align: center; margin: 8px 0 2px; }
.barcode-bars { display: inline-flex; height: 35px; align-items: flex-end; }
.barcode-bars span { display: inline-block; background: #000; height: 100%; }
.barcode-text { font-size: 8px; letter-spacing: 2px; color: #555; margin-top: 2px; }
.print-btn-area { margin-top: 20px; text-align: center; }
.print-btn {
    padding: 12px 30px; background: #1a1a1a; color: white; border: none;
    border-radius: 8px; font-size: 15px; font-family: 'Courier New', monospace;
    cursor: pointer; letter-spacing: 2px;
}
@media print {

    @page {
        size: 80mm;
        margin: 0;
    }

    html,
    body {
        width: 80mm !important;
        max-width: 80mm !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
        overflow: hidden;
    }

    body{
        display:block !important;
    }

    .receipt-wrapper{
        width:80mm !important;
        margin:0 auto !important;
        padding:0 !important;
    }

    .receipt{
        width:72mm !important;
        margin:0 auto !important;
        padding:4mm !important;
        box-shadow:none !important;
        border:none !important;
    }

    .receipt-top,
    .receipt-bottom,
    .print-btn-area{
        display:none !important;
    }
}
