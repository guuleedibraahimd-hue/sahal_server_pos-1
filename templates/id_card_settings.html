<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<title>ID Card Settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
    --blue:#1a5fb4;
    --navy:#0b2e6b;
    --bg:#eef1f8;
    --sidebar-w:250px;
    --topbar-h:72px;
}
*{ box-sizing:border-box; }
body{ font-family:Arial,sans-serif; background:var(--bg); margin:0; padding:0; }

/* ===== LOGIN BOX (isla naqshadda create_id_card.html) ===== */
.loginBox{
    max-width:420px; margin:80px auto; background:#fff; padding:30px;
    border-radius:16px; box-shadow:0 4px 14px rgba(0,0,0,.08); text-align:center;
}
.loginBox h2{ margin:0 0 20px; }
.loginBox input{
    width:100%; padding:14px; border:1px solid #ccc; border-radius:10px;
    font-size:16px; margin-bottom:14px; box-sizing:border-box;
}
.loginBox button{
    width:100%; background:var(--blue); border:none; color:#fff; padding:14px;
    border-radius:10px; font-weight:bold; font-size:15px; cursor:pointer;
}
.err{ color:#d63031; font-weight:bold; margin-bottom:12px; }

/* ===== LAYOUT SHELL ===== */
.shell{ display:flex; min-height:100vh; }

/* ===== SIDEBAR ===== */
.sidebar{
    width:var(--sidebar-w); background:#fff; border-right:1px solid #e3e6ea;
    padding:22px 16px; flex-shrink:0;
}
.sidebar .brand{ display:flex; align-items:center; gap:12px; padding:0 6px 22px; }
.sidebar .brand .name{ font-weight:800; color:var(--navy); font-size:16px; line-height:1.2; }
.sidebar .brand .tag{ font-size:11px; color:#8a93a3; }
.navlink{
    display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px;
    color:#3b4252; text-decoration:none; font-weight:700; font-size:14.5px; margin-bottom:4px;
}
.navlink .ic{ font-size:17px; width:20px; text-align:center; }
.navlink.active{ background:#e7effd; color:var(--blue); }
.navlink:hover:not(.active){ background:#f4f6fa; }

/* ===== TOPBAR ===== */
.main{ flex:1; min-width:0; }
.topbar{
    height:var(--topbar-h); background:#fff; border-bottom:1px solid #e3e6ea;
    display:flex; align-items:center; justify-content:flex-end; gap:22px; padding:0 28px;
}
.bell{ position:relative; font-size:20px; color:#3b4252; }
.bell .dot{
    position:absolute; top:-4px; right:-8px; background:#e74c3c; color:#fff;
    font-size:10px; font-weight:800; border-radius:50%; width:16px; height:16px;
    display:flex; align-items:center; justify-content:center;
}
.who{ display:flex; align-items:center; gap:10px; }
.who .wname{ font-weight:800; color:var(--navy); font-size:14px; line-height:1.2; }
.who .wrole{ font-size:12px; color:#8a93a3; }
.logout{ background:#dc3545; color:#fff; text-decoration:none; padding:8px 16px; border-radius:8px; font-weight:bold; font-size:13px; }

.content{ padding:26px 28px 40px; }
.pageHead{ display:flex; align-items:center; gap:14px; margin-bottom:22px; }
.pageHead .picon{
    width:44px; height:44px; border-radius:12px; background:var(--blue); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;
}
.pageHead h1{ margin:0; font-size:24px; color:#1c2733; }
.crumb{ font-size:13px; color:#8a93a3; margin-top:2px; }
.crumb a{ color:#8a93a3; text-decoration:none; }
.crumb .cur{ color:var(--blue); font-weight:700; }

/* ===== FORM CARD ===== */
.controls{
    background:#fff; padding:24px; border-radius:16px;
    box-shadow:0 4px 14px rgba(0,0,0,.06); margin-bottom:22px;
    max-width:520px;
}
.controls h2{ margin:0 0 18px; display:flex; align-items:center; gap:10px; font-size:17px; color:#1c2733; }
.controls h2 .picon2{
    width:30px; height:30px; border-radius:8px; background:var(--blue); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:14px;
}
.field{ margin-bottom:16px; }
.field label{ font-size:13px; font-weight:bold; color:#333; display:block; margin-bottom:6px; }
.field input{
    width:100%; padding:13px; border:1px solid #ccc; border-radius:10px;
    font-size:15px; box-sizing:border-box;
}
.btn{
    border:none; padding:13px 22px; border-radius:10px; color:#fff;
    font-weight:bold; cursor:pointer; font-size:15px; text-decoration:none;
    display:inline-flex; align-items:center; gap:6px;
}
.save{ background:#1a5fb4; }
.msg{ margin-top:14px; font-weight:bold; font-size:14px; }
.msg.ok{ color:#00b894; }
.msg.bad{ color:#d63031; }

@media(max-width:600px){ .sidebar{ display:none; } }
</style>
</head>
<body>

{% if not logged_in %}

<!-- ===== LOGIN GATE (isla gate-ka create_id_card.html) ===== -->
<div class="loginBox">
    <h2>🪪 ID Card Login</h2>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post" action="/create_id_card">
        <input type="password" name="password" placeholder="Password" required autofocus>
        <button type="submit">Login</button>
    </form>
</div>

{% else %}

<div class="shell">

    <!-- ===== SIDEBAR ===== -->
    <div class="sidebar">
        <div class="brand">
            <div class="name">IMAM UNIVERSITY<br><span class="tag">Together for Excellence</span></div>
        </div>
        <a href="/create_id_card" class="navlink"><span class="ic">🏠</span> Dashboard</a>
        <a href="/create_id_card" class="navlink"><span class="ic">🪪</span> All ID Cards</a>
        <a href="/id_card_settings" class="navlink active"><span class="ic">⚙️</span> Settings</a>
    </div>

    <div class="main">
        <!-- ===== TOPBAR ===== -->
        <div class="topbar">
            <div class="bell">🔔<span class="dot">3</span></div>
            <div class="who">
                <div>
                    <div class="wname">Admin User</div>
                    <div class="wrole">Super Admin</div>
                </div>
            </div>
            <a href="/logout_id_card" class="logout">Logout</a>
        </div>

        <div class="content">
            <div class="pageHead">
                <div class="picon">⚙️</div>
                <div>
                    <h1>Settings</h1>
                    <div class="crumb"><a href="/create_id_card">Dashboard</a> &nbsp;›&nbsp; <span class="cur">Settings</span></div>
                </div>
            </div>

            <!-- ===== CHANGE PASSWORD FORM ===== -->
            <div class="controls">
                <h2><span class="picon2">🔒</span> Beddel Password-ka Login-ka ID Card</h2>

                <div class="field">
                    <label>Password-ka Hadda Jira</label>
                    <input type="password" id="curPass" placeholder="Password-ka hadda">
                </div>
                <div class="field">
                    <label>Password-ka Cusub</label>
                    <input type="password" id="newPass" placeholder="Password cusub">
                </div>
                <div class="field">
                    <label>Xaqiiji Password-ka Cusub</label>
                    <input type="password" id="confirmPass" placeholder="Ku celi password-ka cusub">
                </div>

                <button type="button" class="btn save" onclick="changePassword()">💾 Save Password</button>
                <div class="msg" id="settingsMsg"></div>
            </div>
        </div>
    </div>
</div>

<script>
async function changePassword(){
    const cur     = document.getElementById("curPass").value;
    const next    = document.getElementById("newPass").value;
    const confirm = document.getElementById("confirmPass").value;
    const msgEl   = document.getElementById("settingsMsg");

    function showMsg(text, ok){
        msgEl.textContent = text;
        msgEl.className = "msg " + (ok ? "ok" : "bad");
    }

    if(!cur || !next || !confirm){
        showMsg("Fadlan buuxi dhammaan fields-ka ❌", false);
        return;
    }
    if(next !== confirm){
        showMsg("Password-ka cusub iyo xaqiijintiisu isku mid maaha ❌", false);
        return;
    }
    if(next.length < 4){
        showMsg("Password-ka cusub waa inuu ka badan yahay 4 xaraf ❌", false);
        return;
    }

    try{
        const res = await fetch("/change_id_card_password", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({ current_password: cur, new_password: next })
        });
        const data = await res.json();
        if(data.success){
            showMsg("Password-ka waa la beddelay ✅", true);
            document.getElementById("curPass").value = "";
            document.getElementById("newPass").value = "";
            document.getElementById("confirmPass").value = "";
        } else {
            showMsg("Khalad ❌ " + (data.error || ""), false);
        }
    } catch(e){
        showMsg("Khalad xagga network-ka ❌", false);
    }
}
</script>

{% endif %}

</body>
</html>
