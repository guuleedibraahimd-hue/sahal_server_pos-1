<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<title>Create ID Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{ --blue:#1a5fb4; }
*{ box-sizing:border-box; }
body{ font-family:Arial,sans-serif; background:#eef1f5; margin:0; padding:20px; }

/* ===== LOGIN BOX ===== */
.loginBox{
    max-width:420px; margin:80px auto; background:#fff; padding:30px;
    border-radius:16px; box-shadow:0 4px 14px rgba(0,0,0,.08); text-align:center;
}
.loginBox h2{ margin:0 0 20px; }
.loginBox input{
    width:100%; padding:14px; border:1px solid #ccc; border-radius:10px;
    font-size:16px; margin-bottom:14px; box-sizing:border-box;
}
.loginBox button{
    width:100%; background:var(--blue); border:none; color:#fff; padding:14px;
    border-radius:10px; font-weight:bold; font-size:15px; cursor:pointer;
}
.err{ color:#d63031; font-weight:bold; margin-bottom:12px; }

/* ===== DASHBOARD ===== */
.top{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; max-width:1000px; margin:0 auto 20px; }
.logout{ background:#dc3545; color:#fff; text-decoration:none; padding:10px 18px; border-radius:10px; font-weight:bold; }

.controls{
    max-width:1000px; margin:0 auto 20px; background:#fff; padding:22px;
    border-radius:16px; box-shadow:0 4px 14px rgba(0,0,0,.08);
}
.controls h2{ margin:0 0 16px; }
.formrow{ display:grid; grid-template-columns:1fr 1fr 1fr 1fr 1fr; gap:14px; margin-bottom:6px; }
.formrow label{ font-size:13px; font-weight:bold; color:#333; display:block; margin-bottom:6px; }
.formrow input{
    width:100%; padding:13px; border:1px solid #ccc; border-radius:10px;
    font-size:15px; box-sizing:border-box;
}
.formrow input[type=file]{ padding:9px; }
.btnrow{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; align-items:center; }
.btn{
    border:none; padding:13px 22px; border-radius:10px; color:#fff;
    font-weight:bold; cursor:pointer; font-size:15px; text-decoration:none;
    display:inline-flex; align-items:center; gap:6px;
}
.gen{ background:#1a5fb4; }
.sv{ background:#6c5ce7; }
.dl{ background:#00b894; }
.dlBack{ background:#0984e3; }
.pdf{ background:#e17055; }
.pr{ background:#636e72; }
.msg{ margin-top:12px; font-weight:bold; font-size:14px; }
.msg.ok{ color:#00b894; }
.msg.bad{ color:#d63031; }

.printSizeWrap{
    display:inline-flex; align-items:center; gap:8px; background:#f4f6f9;
    border:1px solid #ccc; border-radius:10px; padding:8px 12px;
}
.printSizeWrap label{ font-size:13px; font-weight:bold; color:#333; margin:0; }
.printSizeWrap select{
    padding:8px 10px; border:1px solid #ccc; border-radius:8px; font-size:14px; background:#fff;
}

@media(max-width:900px){ .formrow{ grid-template-columns:1fr 1fr; } }
@media(max-width:480px){ .formrow{ grid-template-columns:1fr; } }

/* ===== ID CARD (FRONT) ===== */
.cardWrap{ max-width:1000px; margin:0 auto 30px; display:flex; gap:30px; flex-wrap:wrap; justify-content:center; }
.idcard{
    position:relative; width:340px; border-radius:14px; overflow:hidden;
    box-shadow:0 6px 22px rgba(0,0,0,.18);
}
.idcard img.base{ width:100%; display:block; }

/* ===== PHOTO — si sax ah ugu fadhiya shape-ka gadaashiisa ===== */
.photoCircle{
    position: absolute;

    /* Position-ka shape-ka asalka ah */
    top: 35.8%;
    left: 31.0%;

    /* Size-ka shape-ka asalka ah */
    width: 43.5%;
    height: 28.8%;

    overflow: hidden;
    background: transparent;

    display: flex;
    align-items: center;
    justify-content: center;

    /* MUHIIM: circle ma aha */
    border-radius: 0;
}

.photoCircle img{
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    /* Sawirka ha buuxiyo dhammaan shape-ka */
    object-fit: cover;
    object-position: center top;

    display: none;

    /* Ha ka dhigin circle */
    border-radius: 0;
}

.photoCircle .placeholder{
    color: #aaa;
    font-size: 11.5px;
}

/* ===== Overlaid text fields — booska sax ah, size la yareeyay, dragging la saaray ===== */
.ov{ position:absolute; font-weight:800; color:#1a1a2e; user-select:none; padding:2px 6px; }
.ov-idno{ top:61.9%; left:48%; width:22%; font-size:13px; text-align:left; }
.ov-name{ top:68.2%; left:27%; width:68%; font-size:10.5px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ov-title{ top:73.9%; left:38%; width:60%; font-size:11.5px; text-align:left; }
.ov-issue{ top:86.3%; left:44%; width:50%; font-size:12px; text-align:left; color:#fff; }
.ov-expiry{ top:91.1%; left:44%; width:45%; font-size:12px; text-align:left; color:#fff; }

/* ===== History panel — card-ka waa mini-preview (front image + overlays) sax ah, maaha sawirka qofka oo keliya ===== */
.history{
    max-width:1000px; margin:0 auto 40px; background:#fff; padding:22px;
    border-radius:16px; box-shadow:0 4px 14px rgba(0,0,0,.08);
}
.history h2{ margin:0 0 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.countPill{
    font-size:13px; font-weight:800; background:#eef1f5; color:#333;
    padding:5px 12px; border-radius:20px;
}
.countPill.total{ background:#dfe6f5; color:#1a5fb4; }
.countPill.printed{ background:#d4f7ea; color:#00895a; }
.countPill.notprinted{ background:#ffe8cc; color:#b25400; }
.searchBox{ display:flex; gap:10px; margin-bottom:16px; }
.searchBox input{
    flex:1; padding:13px; border:1px solid #ccc; border-radius:10px; font-size:15px;
}
.searchBox button{
    background:var(--blue); color:#fff; border:none; padding:13px 20px;
    border-radius:10px; font-weight:bold; cursor:pointer;
}
.cardList{ display:flex; flex-direction:column; gap:10px; max-height:600px; overflow-y:auto; }
.cardRow{
    display:flex; align-items:center; gap:14px; border:1px solid #e3e6ea;
    border-radius:12px; padding:10px 14px; position:relative;
}

/* Mini ID card preview inside history row — clip-path circle si sawirka aan uga baxsan wareegga */
.miniCard{
    position:relative; width:60px; height:99px; border-radius:6px; overflow:hidden;
    flex-shrink:0; background:#eee; box-shadow:0 2px 6px rgba(0,0,0,.15);
    cursor:pointer;
}
.miniCard img.miniBase{ width:100%; height:100%; object-fit:cover; display:block; }
.miniPhoto{
    position:absolute; top:33.8%; left:26.58%; width:42.76%; height:25.96%;
    border-radius:50%; overflow:hidden; background:#ddd;
    clip-path: circle(50% at 50% 50%);
}
.miniPhoto img{ width:100%; height:100%; object-fit:cover; display:block; border-radius:50%; }
.miniOv{ position:absolute; font-weight:800; color:#1a1a2e; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.miniOv-idno{ top:61.9%; left:50%; width:22%; font-size:3.6px; text-align:left; }
.miniOv-name{ top:68.2%; left:27%; width:69%; font-size:2.9px; text-align:center; }
.miniOv-title{ top:73.9%; left:38%; width:60%; font-size:3.2px; text-align:left; }

.cardRow .info{ flex:1; min-width:0; }
.cardRow .info b{ display:block; font-size:14.5px; }
.cardRow .info span{ font-size:12.5px; color:#666; }
.badge{
    font-size:11px; font-weight:bold; padding:4px 10px; border-radius:20px;
    background:#dfe6e9; color:#2d3436; white-space:nowrap;
}
.badge.printed{ background:#00b894; color:#fff; }
.markBtn{
    background:#fdcb6e; border:none; padding:8px 14px; border-radius:8px;
    font-weight:bold; font-size:12.5px; cursor:pointer; white-space:nowrap;
}
.viewBtn{
    background:#0984e3; border:none; padding:8px 14px; border-radius:8px;
    font-weight:bold; font-size:12.5px; cursor:pointer; white-space:nowrap; color:#fff;
}
.empty{ color:#999; text-align:center; padding:20px; }

/* ===== PRINT: kaliya card-yada (Front + Back) ayaa la daabacaa, cabbirkooda dhabta ah, bog madhan lama darsan ===== */
@media print{
    body{ background:#fff; padding:0; margin:0; }
    .controls, .top, .history, .no-print{ display:none !important; }
    .cardWrap{
        margin:0; gap:6mm; display:flex; flex-wrap:wrap;
        justify-content:flex-start; align-items:flex-start;
    }
    .idcard{
        box-shadow:none; border-radius:0;
        width:54mm !important;
        break-inside:avoid;
    }
}
</style>
</head>
<body>

{% if not logged_in %}

<!-- ===== LOGIN GATE ===== -->
<div class="loginBox">
    <h2>🪪 ID Card Login</h2>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post">
        <input type="password" name="password" placeholder="Password" required autofocus>
        <button type="submit">Login</button>
    </form>
</div>

{% else %}

<!-- ===== TOP ===== -->
<div class="top">
    <h1>🪪 Create ID Card</h1>
    <a href="/logout_id_card" class="logout">Logout</a>
</div>

<!-- ===== FORM ===== -->
<div class="controls no-print">
    <h2>⚙️ ID Card Details</h2>
    <div class="formrow">
        <div>
            <label>Photo</label>
            <input type="file" id="idPhoto" accept="image/*" onchange="loadPhoto(event)">
        </div>
        <div>
            <label>ID No</label>
            <input type="text" id="idNo" value="0000">
        </div>
        <div>
            <label>Enter Full Name</label>
            <input type="text" id="idName" placeholder="Magaca oo dhan">
        </div>
        <div>
            <label>Title</label>
            <input type="text" id="idTitle" placeholder="Tusaale: Xubin Shaqaale">
        </div>
        <div>
            <label>Issue Date</label>
            <input type="date" id="idIssue">
        </div>
        <div>
            <label>Expiry Date</label>
            <input type="date" id="idExpiry">
        </div>
    </div>
    <div class="btnrow">
        <button type="button" class="btn gen" onclick="generateCard()">⚙️ Generate</button>
        <button type="button" class="btn sv" onclick="saveCard()">💾 Save</button>
        <button type="button" class="btn dl" onclick="downloadCard('idcardFront','id_card_front.png')">⬇️ Download Front</button>
        <button type="button" class="btn dlBack" onclick="downloadCard('idcardBack','id_card_back.png')">⬇️ Download Back</button>
        <button type="button" class="btn pdf" onclick="downloadPDF()">📄 Download PDF</button>

        <div class="printSizeWrap">
            <label for="printSize">🖨️ Print Size</label>
            <select id="printSize">
                <option value="auto" selected>Auto (Card size)</option>
                <option value="a4">A4</option>
                <option value="letter">Letter</option>
                <option value="a5">A5</option>
                <option value="cr80">CR80 Card (85.6x54mm)</option>
            </select>
        </div>
        <button type="button" class="btn pr" onclick="printCard()">🖨️ Print</button>
    </div>
    <div class="msg" id="saveMsg"></div>
</div>

<!-- ===== ID CARD PREVIEW (FRONT + BACK) ===== -->
<div class="cardWrap">
    <div class="idcard" id="idcardFront">
        <img class="base" src="/static/IMAM_University_ID_Front.jpg" crossorigin="anonymous" alt="ID Front">
        <div class="photoCircle" id="photoCircle">
            <span class="placeholder" id="photoPlaceholder">Photo</span>
            <img id="photoImg" crossorigin="anonymous" alt="Photo">
        </div>
        <div class="ov ov-idno" id="outIdNo"></div>
        <div class="ov ov-name" id="outName"></div>
        <div class="ov ov-title" id="outTitle"></div>
        <div class="ov ov-issue" id="outIssue"></div>
        <div class="ov ov-expiry" id="outExpiry"></div>
    </div>

    <div class="idcard" id="idcardBack">
        <img class="base" src="/static/IMAM_University_ID_Back.png" crossorigin="anonymous" alt="ID Back">
    </div>
</div>

<!-- ===== HISTORY / ALL ID CARDS ===== -->
<div class="history no-print">
    <h2>
        🗂️ All ID Cards
        <span class="countPill total" id="countTotal">Total: 0</span>
        <span class="countPill printed" id="countPrinted">Printed: 0</span>
        <span class="countPill notprinted" id="countNotPrinted">Not Printed: 0</span>
    </h2>
    <div class="searchBox">
        <input type="text" id="searchInput" placeholder="Search by ID No or Name...">
        <button type="button" onclick="searchCards()">🔍 Search</button>
    </div>
    <div class="cardList" id="cardList">
        <div class="empty">Loading...</div>
    </div>
</div>

<!-- ===== Dynamic @page style-ka print-ka, size-ka la doortay ayaa halkan lagu qori doonaa ===== -->
<style id="dynamicPageStyle"></style>

<script>
function fmt(dateStr){
    if(!dateStr) return "DD-MM-YYYY";
    const [y,m,d] = dateStr.split("-");
    return `${d}-${m}-${y}`;
}
function fmtLive(dateStr){
    if(!dateStr) return "";
    const [y,m,d] = dateStr.split("-");
    return `${d}-${m}-${y}`;
}

function loadPhoto(event){
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
        const img = document.getElementById("photoImg");
        img.src = e.target.result;
        img.style.display = "block";
        document.getElementById("photoPlaceholder").style.display = "none";
    };
    reader.readAsDataURL(file);
}

function generateCard(){
    document.getElementById("outIdNo").textContent = document.getElementById("idNo").value.trim();
    document.getElementById("outName").textContent = document.getElementById("idName").value.trim();
    document.getElementById("outTitle").textContent = document.getElementById("idTitle").value.trim();
    document.getElementById("outIssue").textContent = fmt(document.getElementById("idIssue").value);
    document.getElementById("outExpiry").textContent = fmt(document.getElementById("idExpiry").value);
}

function liveUpdate(){
    document.getElementById("outIdNo").textContent = document.getElementById("idNo").value.trim();
    document.getElementById("outName").textContent = document.getElementById("idName").value.trim();
    document.getElementById("outTitle").textContent = document.getElementById("idTitle").value.trim();
    document.getElementById("outIssue").textContent = fmtLive(document.getElementById("idIssue").value);
    document.getElementById("outExpiry").textContent = fmtLive(document.getElementById("idExpiry").value);
}

["idNo","idName","idTitle","idIssue","idExpiry"].forEach(id=>{
    document.getElementById(id).addEventListener("input", liveUpdate);
});

function downloadCard(elId, filename){
    generateCard();
    const card = document.getElementById(elId);
    html2canvas(card, { scale: 3, backgroundColor: "#ffffff", useCORS: true })
    .then(canvas => {
        const link = document.createElement("a");
        link.download = filename;
        link.href = canvas.toDataURL("image/png");
        link.click();
    });
}

function downloadPDF(){
    generateCard();
    const front = document.getElementById("idcardFront");
    const back = document.getElementById("idcardBack");

    Promise.all([
        html2canvas(front, { scale: 3, backgroundColor: "#ffffff", useCORS: true }),
        html2canvas(back,  { scale: 3, backgroundColor: "#ffffff", useCORS: true })
    ]).then(([canvasFront, canvasBack]) => {
        const { jsPDF } = window.jspdf;
        const w = 60;
        const h = w * (canvasFront.height / canvasFront.width);

        const pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: [w, h] });
        pdf.addImage(canvasFront.toDataURL("image/png"), "PNG", 0, 0, w, h);

        pdf.addPage([w, h], "portrait");
        pdf.addImage(canvasBack.toDataURL("image/png"), "PNG", 0, 0, w, h);

        pdf.save("id_card.pdf");
    });
}

/* Sawirka qofka (photo) waxaa lagu daboolayaa clip-path circle si uu shape-ka wareegga ugu fadhiisto
   si sax ah oo aan meelna ka baxsanayn, mar la Generate-eeyo iyo mar la keydiyo/Save labadaba. */
function clipPhotoToCircle(){
    const img = document.getElementById("photoImg");
    img.style.clipPath = "circle(50% at 50% 50%)";
    img.style.borderRadius = "50%";
}
clipPhotoToCircle();

/* ===== Print-ka: mar walba kaliya card-yada (Front+Back) ayaa la daabacaa, cabbirkooda dhabta ah (54mm),
   iyada oo aan bog madhan lagu darin — size-ka la doortay wuxuu go'aaminayaa kaliya cabbirka bogga daabacaadda,
   ma beddelayo naqshadda ama waxa la daabacayo. ===== */
const PAGE_SIZES = {
    auto:   "auto",
    a4:     "210mm 297mm",
    letter: "8.5in 11in",
    a5:     "148mm 210mm",
    cr80:   "85.6mm 54mm landscape"
};

function printCard(){
    generateCard();
    const choice = document.getElementById("printSize").value;
    const styleTag = document.getElementById("dynamicPageStyle");

    if(choice === "cr80"){
        styleTag.textContent = `
            @page{ size:${PAGE_SIZES.cr80}; margin:0; }
            .idcard{ width:85.6mm !important; }
            .cardWrap{ gap:0 !important; }
        `;
    } else {
        const size = choice === "auto" ? "auto" : PAGE_SIZES[choice];
        styleTag.textContent = `@page{ size:${size}; margin:8mm; }`;
    }

    setTimeout(()=>{ window.print(); }, 50);
}

function showMsg(text, ok){
    const el = document.getElementById("saveMsg");
    el.textContent = text;
    el.className = "msg " + (ok ? "ok" : "bad");
    setTimeout(()=>{ el.textContent = ""; el.className = "msg"; }, 4000);
}

async function saveCard(){
    generateCard();
    const idNo   = document.getElementById("idNo").value.trim();
    const name   = document.getElementById("idName").value.trim();
    const title  = document.getElementById("idTitle").value.trim();
    const issue  = fmt(document.getElementById("idIssue").value);
    const expiry = fmt(document.getElementById("idExpiry").value);
    const photoImg = document.getElementById("photoImg");
    const photo = (photoImg.style.display !== "none" && photoImg.src) ? photoImg.src : "";

    if(!idNo || !name){
        showMsg("Fadlan buuxi ID No iyo Name ❌", false);
        return;
    }

    try{
        const res = await fetch("/save_id_card", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({ id_no:idNo, name:name, title:title, issue:issue, expiry:expiry, photo:photo })
        });
        const data = await res.json();
        if(data.success){
            showMsg("ID Card waa la keydiyay ✅", true);
            prependCardLocally({ id_no:idNo, name:name, title:title, issue:issue, expiry:expiry, photo:photo, printed:false, doc_id:idNo });
        } else {
            showMsg("Khalad ❌ " + (data.error || ""), false);
        }
    } catch(e){
        showMsg("Khalad xagga network-ka ❌", false);
    }
}

function escapeHtml(s){
    return (s || "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
}

/* Dhis mini-card sax ah oo isticmaala naqshadda front dhabta ah (background + photo circle clip-gareeyay + overlays) */
function renderMiniCard(c){
    const photoHtml = c.photo
        ? `<img src="${c.photo}" onerror="this.style.visibility='hidden'">`
        : "";
    return `
        <div class="miniCard">
            <img class="miniBase" src="/static/IMAM_University_ID_Front.jpg">
            <div class="miniPhoto">${photoHtml}</div>
            <div class="miniOv miniOv-idno">${escapeHtml(c.id_no)}</div>
            <div class="miniOv miniOv-name">${escapeHtml(c.name)}</div>
            <div class="miniOv miniOv-title">${escapeHtml(c.title || "")}</div>
        </div>`;
}

/* Xisaabi tirada guud, la daabacay, aan la daabicin iyo ku dar list-ka dushiisa (backend-ka ayay kaga imaan,
   marna lama muujiyo halkan calculator/UI gaar ah — kaliya pill-yada tirada). */
function updateCounts(cards){
    const total = cards.length;
    const printed = cards.filter(c => c.printed).length;
    const notPrinted = total - printed;
    document.getElementById("countTotal").textContent = `Total: ${total}`;
    document.getElementById("countPrinted").textContent = `Printed: ${printed}`;
    document.getElementById("countNotPrinted").textContent = `Not Printed: ${notPrinted}`;
}

function renderCards(cards){
    updateCounts(cards);
    const list = document.getElementById("cardList");
    if(!cards || cards.length === 0){
        list.innerHTML = '<div class="empty">Wax ID Card ah lama helin.</div>';
        return;
    }
    list.innerHTML = cards.map(c => {
        const printedBadge = c.printed
            ? '<span class="badge printed">✅ Already Printed</span>'
            : '<span class="badge">Not Printed</span>';
        const markBtn = c.printed
            ? ''
            : `<button class="markBtn" onclick="markPrinted('${encodeURIComponent(c.doc_id)}')">Mark Printed</button>`;
        return `
        <div class="cardRow">
            ${renderMiniCard(c)}
            <div class="info">
                <b>${escapeHtml(c.name)} <span style="font-weight:normal;color:#888;">#${escapeHtml(c.id_no)}</span></b>
                <span>${escapeHtml(c.title || "")} · Issue: ${escapeHtml(c.issue || "-")} · Expiry: ${escapeHtml(c.expiry || "-")}</span>
            </div>
            ${printedBadge}
            <button class="viewBtn" onclick='viewCardPDF(${JSON.stringify(c).replace(/'/g,"&#39;")})'>📄 View PDF</button>
            ${markBtn}
        </div>`;
    }).join("");
}

/* Fur ID card-ka oo dhan (Front + Back) PDF ahaan hal fayl ah, isticmaalaya naqshadda originalka ah,
   halkii uu si toos ah u furi lahaa sawirka qofka oo keliya (base64 data URL) sida hore ka dhacday. */
async function viewCardPDF(c){
    document.getElementById("idNo").value    = c.id_no || "";
    document.getElementById("idName").value  = c.name || "";
    document.getElementById("idTitle").value = c.title || "";

    const toInput = (ddmmyyyy) => {
        if(!ddmmyyyy || ddmmyyyy === "DD-MM-YYYY") return "";
        const [d,m,y] = ddmmyyyy.split("-");
        return `${y}-${m}-${d}`;
    };
    document.getElementById("idIssue").value  = toInput(c.issue);
    document.getElementById("idExpiry").value = toInput(c.expiry);

    const photoImg = document.getElementById("photoImg");
    if(c.photo){
        photoImg.src = c.photo;
        photoImg.style.display = "block";
        document.getElementById("photoPlaceholder").style.display = "none";
        clipPhotoToCircle();
    } else {
        photoImg.style.display = "none";
        document.getElementById("photoPlaceholder").style.display = "flex";
    }

    generateCard();
    await new Promise(r => setTimeout(r, 150));

    const front = document.getElementById("idcardFront");
    const back = document.getElementById("idcardBack");

    const [canvasFront, canvasBack] = await Promise.all([
        html2canvas(front, { scale: 3, backgroundColor: "#ffffff", useCORS: true }),
        html2canvas(back,  { scale: 3, backgroundColor: "#ffffff", useCORS: true })
    ]);

    const { jsPDF } = window.jspdf;
    const w = 60;
    const h = w * (canvasFront.height / canvasFront.width);

    const pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: [w, h] });
    pdf.addImage(canvasFront.toDataURL("image/png"), "PNG", 0, 0, w, h);
    pdf.addPage([w, h], "portrait");
    pdf.addImage(canvasBack.toDataURL("image/png"), "PNG", 0, 0, w, h);

    window.open(pdf.output("bloburl"), "_blank");
}

let localCardsCache = [];
function prependCardLocally(card){
    localCardsCache = localCardsCache.filter(c => c.doc_id !== card.doc_id);
    localCardsCache.unshift(card);
    renderCards(localCardsCache);
}

async function loadCards(q){
    const list = document.getElementById("cardList");
    list.innerHTML = '<div class="empty">Loading...</div>';
    try{
        const url = "/list_id_cards" + (q ? ("?q=" + encodeURIComponent(q)) : "");
        const res = await fetch(url);
        const data = await res.json();
        if(data.success){
            localCardsCache = data.cards;
            renderCards(data.cards);
        } else {
            list.innerHTML = '<div class="empty">Khalad ayaa dhacay.</div>';
        }
    } catch(e){
        list.innerHTML = '<div class="empty">Khalad xagga network-ka.</div>';
    }
}

function searchCards(){
    const q = document.getElementById("searchInput").value.trim();
    loadCards(q);
}

document.getElementById("searchInput").addEventListener("keyup", function(e){
    if(e.key === "Enter"){ searchCards(); }
    else if(this.value.trim() === ""){ loadCards(); }
});

async function markPrinted(docId){
    try{
        const res = await fetch("/mark_id_card_printed/" + docId, { method: "POST" });
        const data = await res.json();
        if(data.success){
            loadCards(document.getElementById("searchInput").value.trim());
        }
    } catch(e){}
}

liveUpdate();
loadCards();
