<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<title>Create ID Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
    --blue:#1a5fb4;
    --navy:#0b2e6b;
    --bg:#eef1f8;
    --sidebar-w:250px;
    --topbar-h:72px;
}
*{ box-sizing:border-box; }
body{ font-family:Arial,sans-serif; background:var(--bg); margin:0; padding:0; }

/* ===== LOGIN BOX ===== */
.loginBox{
    max-width:420px; margin:80px auto; background:#fff; padding:30px;
    border-radius:16px; box-shadow:0 4px 14px rgba(0,0,0,.08); text-align:center;
}
.loginBox h2{ margin:0 0 20px; }
.loginBox input{
    width:100%; padding:14px; border:1px solid #ccc; border-radius:10px;
    font-size:16px; margin-bottom:14px; box-sizing:border-box;
}
.loginBox button{
    width:100%; background:var(--blue); border:none; color:#fff; padding:14px;
    border-radius:10px; font-weight:bold; font-size:15px; cursor:pointer;
}
.err{ color:#d63031; font-weight:bold; margin-bottom:12px; }

/* ===== LAYOUT SHELL ===== */
.shell{ display:flex; min-height:100vh; }

/* ===== SIDEBAR ===== */
.sidebar{
    width:var(--sidebar-w); background:#fff; border-right:1px solid #e3e6ea;
    padding:22px 16px; flex-shrink:0;
}
.sidebar .brand{ display:flex; align-items:center; gap:12px; padding:0 6px 22px; }
.sidebar .brand .name{ font-weight:800; color:var(--navy); font-size:16px; line-height:1.2; }
.sidebar .brand .tag{ font-size:11px; color:#8a93a3; }
.navlink{
    display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px;
    color:#3b4252; text-decoration:none; font-weight:700; font-size:14.5px; margin-bottom:4px;
}
.navlink .ic{ font-size:17px; width:20px; text-align:center; }
.navlink.active{ background:#e7effd; color:var(--blue); }
.navlink:hover:not(.active){ background:#f4f6fa; }

/* ===== TOPBAR ===== */
.main{ flex:1; min-width:0; }
.topbar{
    height:var(--topbar-h); background:#fff; border-bottom:1px solid #e3e6ea;
    display:flex; align-items:center; justify-content:flex-end; gap:22px; padding:0 28px;
}
.bell{ position:relative; font-size:20px; color:#3b4252; }
.bell .dot{
    position:absolute; top:-4px; right:-8px; background:#e74c3c; color:#fff;
    font-size:10px; font-weight:800; border-radius:50%; width:16px; height:16px;
    display:flex; align-items:center; justify-content:center;
}
.who{ display:flex; align-items:center; gap:10px; }
.who .wname{ font-weight:800; color:var(--navy); font-size:14px; line-height:1.2; }
.who .wrole{ font-size:12px; color:#8a93a3; }
.logout{ background:#dc3545; color:#fff; text-decoration:none; padding:8px 16px; border-radius:8px; font-weight:bold; font-size:13px; }

.content{ padding:26px 28px 40px; }
.pageHead{ display:flex; align-items:center; gap:14px; margin-bottom:22px; }
.pageHead .picon{
    width:44px; height:44px; border-radius:12px; background:var(--blue); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;
}
.pageHead h1{ margin:0; font-size:24px; color:#1c2733; }
.crumb{ font-size:13px; color:#8a93a3; margin-top:2px; }
.crumb a{ color:#8a93a3; text-decoration:none; }
.crumb .cur{ color:var(--blue); font-weight:700; }

/* ===== FORM CARD ===== */
.controls{
    background:#fff; padding:24px; border-radius:16px;
    box-shadow:0 4px 14px rgba(0,0,0,.06); margin-bottom:22px;
}
.controls h2{ margin:0 0 18px; display:flex; align-items:center; gap:10px; font-size:17px; color:#1c2733; }
.controls h2 .picon2{
    width:30px; height:30px; border-radius:8px; background:var(--blue); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:14px;
}
.formrow{ display:grid; grid-template-columns:1fr 1fr 1fr 1fr 1fr; gap:14px; margin-bottom:14px; }
.formrow label{ font-size:13px; font-weight:bold; color:#333; display:block; margin-bottom:6px; }
.formrow input{
    width:100%; padding:13px; border:1px solid #ccc; border-radius:10px;
    font-size:15px; box-sizing:border-box;
}
.formrow input[type=file]{ padding:9px; }
.btnrow{ display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; align-items:center; }
.btn{
    border:none; padding:13px 22px; border-radius:10px; color:#fff;
    font-weight:bold; cursor:pointer; font-size:15px; text-decoration:none;
    display:inline-flex; align-items:center; gap:6px;
}
.gen{ background:#1a5fb4; }
.dl{ background:#00b894; }
.dlBack{ background:#0984e3; }
.pdf{ background:#e17055; }
.pr{ background:#636e72; }
.del-all{ background:#d63031; }
.msg{ margin-top:12px; font-weight:bold; font-size:14px; }
.msg.ok{ color:#00b894; }
.msg.bad{ color:#d63031; }

.printSizeWrap{
    display:inline-flex; align-items:center; gap:8px; background:#f4f6f9;
    border:1px solid #ccc; border-radius:10px; padding:8px 12px;
}
.printSizeWrap label{ font-size:13px; font-weight:bold; color:#333; margin:0; }
.printSizeWrap select{
    padding:8px 10px; border:1px solid #ccc; border-radius:8px; font-size:14px; background:#fff;
}

@media(max-width:1000px){ .formrow{ grid-template-columns:1fr 1fr; } }
@media(max-width:600px){ .formrow{ grid-template-columns:1fr; } .sidebar{ display:none; } }

/* ===== ID CARD (FRONT/BACK PREVIEW — hidden render targets used for image/pdf capture) ===== */
.cardWrap{ display:flex; gap:30px; flex-wrap:wrap; justify-content:center; margin-bottom:22px; }
.idcard{
    position:relative; width:340px; border-radius:14px; overflow:hidden;
    box-shadow:0 6px 22px rgba(0,0,0,.18);
}
.idcard img.base{ width:100%; display:block; }

.photoCircle{
    position:absolute; top:32.8%; left:26.0%; width:43.5%; height:28.8%;
    overflow:hidden; background:transparent;
    display:flex; align-items:center; justify-content:center; border-radius:0;
}
.photoCircle img{
    position:absolute; top:0; left:0; width:100%; height:100%;
    object-fit:cover; object-position:center top; display:none; border-radius:0;
}
.photoCircle .placeholder{ color:#aaa; font-size:11.5px; }

.ov{ position:absolute; font-weight:800; color:#1a1a2e; user-select:none; padding:2px 6px; }
.ov-idno{ top:61.9%; left:48%; width:22%; font-size:13px; text-align:left; }
.ov-name{ top:68.2%; left:27%; width:68%; font-size:10.5px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ov-title{ top:73.9%; left:38%; width:60%; font-size:11.5px; text-align:left; }
.ov-issue{ top:86.3%; left:44%; width:50%; font-size:12px; text-align:left; color:#fff; }
.ov-expiry{ top:91.1%; left:44%; width:45%; font-size:12px; text-align:left; color:#fff; }

/* ===== TABLE — "All ID Cards" dashboard style ===== */
.tableCard{
    background:#fff; padding:24px; border-radius:16px; box-shadow:0 4px 14px rgba(0,0,0,.06);
}
.tableCard h2{ margin:0 0 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:17px; color:#1c2733; }
.tableCard h2 .picon2{
    width:30px; height:30px; border-radius:8px; background:var(--blue); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:14px;
}
.countPill{
    font-size:13px; font-weight:800; background:#eef1f5; color:#333;
    padding:5px 12px; border-radius:20px;
}
.countPill.total{ background:#dfe6f5; color:#1a5fb4; }
.countPill.printed{ background:#d4f7ea; color:#00895a; }
.countPill.notprinted{ background:#ffe8cc; color:#b25400; }
.searchBox{ display:flex; gap:10px; margin-bottom:18px; }
.searchBox input{
    flex:1; padding:13px; border:1px solid #ccc; border-radius:10px; font-size:15px;
}
.searchBox button{
    background:var(--blue); color:#fff; border:none; padding:13px 20px;
    border-radius:10px; font-weight:bold; cursor:pointer;
}

table.idTable{ width:100%; border-collapse:collapse; }
table.idTable thead th{
    text-align:left; font-size:12.5px; text-transform:uppercase; letter-spacing:.02em;
    color:#8a93a3; padding:10px 12px; border-bottom:2px solid #eef1f5;
}
table.idTable tbody td{
    padding:12px; border-bottom:1px solid #eef1f5; font-size:14px; color:#2d3436; vertical-align:middle;
}
table.idTable tbody tr:hover{ background:#fafbfd; }

/* Mini ID card preview inside table row — background + overlay, clip-path circle photo */
.miniCard{
    position:relative; width:52px; height:86px; border-radius:6px; overflow:hidden;
    flex-shrink:0; background:#eee; box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.miniCard img.miniBase{ width:100%; height:100%; object-fit:cover; display:block; }
.miniPhoto{
    position:absolute; top:32.8%; left:26.0%; width:42.80%; height:25.96%;
    border-radius:50%; overflow:hidden; background:#ddd;
    clip-path: circle(50% at 50% 50%);
}
.miniPhoto img{ width:100%; height:100%; object-fit:cover; display:block; border-radius:50%; }
.miniOv{ position:absolute; font-weight:800; color:#1a1a2e; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.miniOv-idno{ top:61.9%; left:50%; width:22%; font-size:3.2px; text-align:left; }
.miniOv-name{ top:68.2%; left:27%; width:69%; font-size:2.6px; text-align:center; }
.miniOv-title{ top:73.9%; left:38%; width:60%; font-size:2.9px; text-align:left; }

.badge{
    font-size:11px; font-weight:bold; padding:4px 12px; border-radius:20px;
    background:#dfe6e9; color:#2d3436; white-space:nowrap; display:inline-block;
}
.badge.printed{ background:#d4f7ea; color:#00895a; }
.actionsCell{ display:flex; gap:8px; flex-wrap:wrap; }
.miniBtn{
    border:none; padding:8px 12px; border-radius:8px; font-weight:bold; font-size:12.5px;
    cursor:pointer; white-space:nowrap; color:#fff; display:inline-flex; align-items:center; gap:5px;
}
.viewBtn{ background:#0984e3; }
.printBtn{ background:#00b894; }
.markBtn{ background:#fdcb6e; color:#3b3b3b; }
.delBtn{ background:#ff7675; }
.empty{ color:#999; text-align:center; padding:24px; }

/* ===== PRINT: kaliya card-yada (Front + Back) ayaa la daabacaa, cabbirkooda dhabta ah, bog madhan lama darsan ===== */
@media print{
    body{ background:#fff; padding:0; margin:0; }
    .sidebar, .topbar, .controls, .tableCard, .pageHead, .no-print{ display:none !important; }
    .content{ padding:0 !important; }
    .cardWrap{
        margin:0; gap:6mm; display:flex; flex-wrap:wrap;
        justify-content:flex-start; align-items:flex-start;
    }
    .idcard{
        box-shadow:none; border-radius:0;
        width:54mm !important;
        break-inside:avoid;
    }
}
</style>
</head>
<body>

{% if not logged_in %}

<!-- ===== LOGIN GATE ===== -->
<div class="loginBox">
    <h2>🪪 ID Card Login</h2>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post">
        <input type="password" name="password" placeholder="Password" required autofocus>
        <button type="submit">Login</button>
    </form>
</div>

{% else %}

<div class="shell">

    <!-- ===== SIDEBAR ===== -->
    <div class="sidebar no-print">
        <div class="brand">
            <div class="name">IMAM UNIVERSITY<br><span class="tag">Together for Excellence</span></div>
        </div>
        <a href="/create_id_card" class="navlink active"><span class="ic">🏠</span> Dashboard</a>
        <a href="/all_id_cards" class="navlink"><span class="ic">🪪</span> All ID Cards</a>
        <a href="/id_card_settings" class="navlink"><span class="ic">⚙️</span> Settings</a>
    </div>

    <div class="main">
        <!-- ===== TOPBAR ===== -->
        <div class="topbar no-print">
            <div class="bell">🔔<span class="dot"></span></div>
            <div class="who">
                <div>
                    <div class="wname">Admin User</div>
                    <div class="wrole">Super Admin</div>
                </div>
            </div>
            <a href="/logout_id_card" class="logout">Logout</a>
        </div>

        <div class="content">
            <div class="pageHead no-print">
                <div class="picon">🪪</div>
                <div>
                    <h1>Create ID Card</h1>
                    <div class="crumb"><a href="/dashboard">Dashboard</a> &nbsp;›&nbsp; <span class="cur">Create ID Card</span></div>
                </div>
            </div>

            <!-- ===== FORM ===== -->
            <div class="controls no-print">
                <h2><span class="picon2">⚙️</span> ID Card Details</h2>
                <div class="formrow">
                    <div>
                        <label>Photo</label>
                        <input type="file" id="idPhoto" accept="image/*" onchange="loadPhoto(event)">
                    </div>
                    <div>
                        <label>ID No</label>
                        <input type="text" id="idNo" value="0000">
                    </div>
                    <div>
                        <label>Enter Full Name</label>
                        <input type="text" id="idName" placeholder="Magaca oo dhan">
                    </div>
                    <div>
                        <label>Title</label>
                        <input type="text" id="idTitle" placeholder="Tusaale: Xubin Shaqaale">
                    </div>
                    <div>
                        <label>Issue Date</label>
                        <input type="date" id="idIssue">
                    </div>
                </div>
                <div class="formrow" style="grid-template-columns:1fr;">
                    <div style="max-width:260px;">
                        <label>Expiry Date</label>
                        <input type="date" id="idExpiry">
                    </div>
                </div>
                <div class="btnrow">
                    <button type="button" class="btn gen" onclick="generateCard()">⚙️ Generate</button>
                    <button type="button" class="btn dl" onclick="downloadCard('idcardFront','id_card_front.png')">⬇️ Download Front</button>
                    <button type="button" class="btn dlBack" onclick="downloadCard('idcardBack','id_card_back.png')">⬇️ Download Back</button>
                    <button type="button" class="btn pdf" onclick="downloadPDF()">📄 Download PDF</button>

                    <div class="printSizeWrap">
                        <label for="printSize">🖨️ Print Size</label>
                        <select id="printSize">
                            <option value="auto" selected>Auto (Card size)</option>
                            <option value="a4">A4</option>
                            <option value="letter">Letter</option>
                            <option value="a5">A5</option>
                            <option value="cr80">CR80 Card (85.6x54mm)</option>
                        </select>
                    </div>
                    <button type="button" class="btn pr" onclick="printCard()">🖨️ Print</button>
                </div>
                <div class="msg" id="saveMsg"></div>
            </div>

            <!-- ===== ID CARD PREVIEW (FRONT + BACK) — render targets for capture/print ===== -->
            <div class="cardWrap">
                <div class="idcard" id="idcardFront">
                    <img class="base" src="/static/IMAM_University_ID_Front.jpg" crossorigin="anonymous" alt="ID Front">
                    <div class="photoCircle" id="photoCircle">
                        <span class="placeholder" id="photoPlaceholder">Photo</span>
                        <img id="photoImg" crossorigin="anonymous" alt="Photo">
                    </div>
                    <div class="ov ov-idno" id="outIdNo"></div>
                    <div class="ov ov-name" id="outName"></div>
                    <div class="ov ov-title" id="outTitle"></div>
                    <div class="ov ov-issue" id="outIssue"></div>
                    <div class="ov ov-expiry" id="outExpiry"></div>
                </div>

                <div class="idcard" id="idcardBack">
                    <img class="base" src="/static/IMAM_University_ID_Back.png" crossorigin="anonymous" alt="ID Back">
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ===== Dynamic @page style-ka print-ka, size-ka la doortay ayaa halkan lagu qori doonaa ===== -->
<style id="dynamicPageStyle"></style>

<script>
function fmt(dateStr){
    if(!dateStr) return "DD-MM-YYYY";
    const [y,m,d] = dateStr.split("-");
    return `${d}-${m}-${y}`;
}
function fmtLive(dateStr){
    if(!dateStr) return "";
    const [y,m,d] = dateStr.split("-");
    return `${d}-${m}-${y}`;
}

function loadPhoto(event){
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
        const img = document.getElementById("photoImg");
        img.src = e.target.result;
        img.style.display = "block";
        document.getElementById("photoPlaceholder").style.display = "none";
    };
    reader.readAsDataURL(file);
}

function liveUpdate(){
    document.getElementById("outIdNo").textContent = document.getElementById("idNo").value.trim();
    document.getElementById("outName").textContent = document.getElementById("idName").value.trim();
    document.getElementById("outTitle").textContent = document.getElementById("idTitle").value.trim();
    document.getElementById("outIssue").textContent = fmtLive(document.getElementById("idIssue").value);
    document.getElementById("outExpiry").textContent = fmtLive(document.getElementById("idExpiry").value);
}

["idNo","idName","idTitle","idIssue","idExpiry"].forEach(id=>{
    document.getElementById(id).addEventListener("input", liveUpdate);
});

function downloadCard(elId, filename){
    const card = document.getElementById(elId);
    html2canvas(card, { scale: 3, backgroundColor: "#ffffff", useCORS: true })
    .then(canvas => {
        const link = document.createElement("a");
        link.download = filename;
        link.href = canvas.toDataURL("image/png");
        link.click();
    });
}

function downloadPDF(){
    const front = document.getElementById("idcardFront");
    const back = document.getElementById("idcardBack");

    Promise.all([
        html2canvas(front, { scale: 3, backgroundColor: "#ffffff", useCORS: true }),
        html2canvas(back,  { scale: 3, backgroundColor: "#ffffff", useCORS: true })
    ]).then(([canvasFront, canvasBack]) => {
        const { jsPDF } = window.jspdf;
        const w = 60;
        const h = w * (canvasFront.height / canvasFront.width);

        const pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: [w, h] });
        pdf.addImage(canvasFront.toDataURL("image/png"), "PNG", 0, 0, w, h);

        pdf.addPage([w, h], "portrait");
        pdf.addImage(canvasBack.toDataURL("image/png"), "PNG", 0, 0, w, h);

        pdf.save("id_card.pdf");
    });
}

/* Sawirka qofka (photo) waxaa lagu daboolayaa clip-path circle si uu shape-ka wareegga ugu fadhiisto
   si sax ah oo aan meelna ka baxsanayn, mar la Generate-eeyo iyo mar la keydiyo/Save labadaba. */
function clipPhotoToCircle(){
    const img = document.getElementById("photoImg");
    img.style.clipPath = "circle(50% at 50% 50%)";
    img.style.borderRadius = "50%";
}
clipPhotoToCircle();

/* ===== Print-ka: mar walba kaliya card-yada (Front+Back) ayaa la daabacaa, cabbirkooda dhabta ah (54mm),
   iyada oo aan bog madhan lagu darin — size-ka la doortay wuxuu go'aaminayaa kaliya cabbirka bogga daabacaadda,
   ma beddelayo naqshadda ama waxa la daabacayo. ===== */
const PAGE_SIZES = {
    auto:   "auto",
    a4:     "210mm 297mm",
    letter: "8.5in 11in",
    a5:     "148mm 210mm",
    cr80:   "85.6mm 54mm landscape"
};

function applyPrintPageStyle(){
    const choice = document.getElementById("printSize").value;
    const styleTag = document.getElementById("dynamicPageStyle");

    if(choice === "cr80"){
        styleTag.textContent = `
            @page{ size:${PAGE_SIZES.cr80}; margin:0; }
            .idcard{ width:85.6mm !important; }
            .cardWrap{ gap:0 !important; }
        `;
    } else {
        const size = choice === "auto" ? "auto" : PAGE_SIZES[choice];
        styleTag.textContent = `@page{ size:${size}; margin:8mm; }`;
    }
}

function printCard(){
    applyPrintPageStyle();
    setTimeout(()=>{ window.print(); }, 50);
}

function showMsg(text, ok){
    const el = document.getElementById("saveMsg");
    el.textContent = text;
    el.className = "msg " + (ok ? "ok" : "bad");
    setTimeout(()=>{ el.textContent = ""; el.className = "msg"; }, 4000);
}

/* Generate = live-fill card PREVIEW + AUTO-SAVE to Firestore toos ah, iyada oo aan la sugin Save gooni ah.
   Kadib list/table-ka waxa lagu cusboonaysiiyaa toos ah (prependCardLocally). */
async function generateCard(){
    liveUpdate();

    const idNo   = document.getElementById("idNo").value.trim();
    const name   = document.getElementById("idName").value.trim();
    const title  = document.getElementById("idTitle").value.trim();
    const issue  = fmt(document.getElementById("idIssue").value);
    const expiry = fmt(document.getElementById("idExpiry").value);
    const photoImg = document.getElementById("photoImg");
    const photo = (photoImg.style.display !== "none" && photoImg.src) ? photoImg.src : "";

    if(!idNo || !name){
        showMsg("Fadlan buuxi ID No iyo Name ❌", false);
        return;
    }

    try{
        const res = await fetch("/save_id_card", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({ id_no:idNo, name:name, title:title, issue:issue, expiry:expiry, photo:photo })
        });
        const data = await res.json();
        if(data.success){
            showMsg("ID Card waa la keydiyay ✅", true);
        } else {
            showMsg("Khalad ❌ " + (data.error || ""), false);
        }
    } catch(e){
        showMsg("Khalad xagga network-ka ❌", false);
    }
}

function escapeHtml(s){
    return (s || "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
}

liveUpdate();
</script>

{% endif %}

</body>
</html>
