<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<title>Payment QR — A4</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{ --blue:#1a5fb4; }
*{ box-sizing:border-box; }
body{ font-family:Arial,sans-serif; background:#eef1f5; margin:0; padding:20px; }

.controls{
    max-width:820px; margin:0 auto 20px; background:#fff; padding:22px;
    border-radius:16px; box-shadow:0 4px 14px rgba(0,0,0,.08);
}
.controls h2{ margin:0 0 16px; }
.controls input[type=text]{
    width:100%; padding:14px; border:1px solid #ccc; border-radius:10px;
    font-size:16px; margin-bottom:14px;
}
.btnrow{ display:flex; gap:10px; flex-wrap:wrap; }
.btn{
    border:none; padding:13px 22px; border-radius:10px; color:#fff;
    font-weight:bold; cursor:pointer; font-size:15px; text-decoration:none;
    display:inline-flex; align-items:center; gap:6px;
}
.gen{ background:#1a5fb4; }
.dl{ background:#00b894; }
.pr{ background:#636e72; }
.err{ color:#d63031; font-weight:bold; margin-bottom:12px; }

/* ===== A4 SHEET ===== */
.sheet{
    width:210mm; min-height:297mm; margin:0 auto; background:#fff;
    padding:22mm 20mm; box-shadow:0 4px 20px rgba(0,0,0,.15);
    display:flex; flex-direction:column; align-items:center;
}

/* ===== HEADER (Imam University) ===== */
.header{ width:100%; border-bottom:4px solid var(--blue); padding-bottom:10px; }
.head-top{ display:flex; justify-content:space-between; align-items:center; gap:14px; }
.head-left .uni-name{ color:var(--blue); font-size:30px; font-weight:800; letter-spacing:1px; line-height:1; }
.head-left .uni-sub{ font-size:12px; font-weight:700; color:#333; margin-top:4px; }
.crest{ width:78px; height:78px; }
.crest img{ width:100%; height:100%; object-fit:contain; }
.head-right{ text-align:right; }
.head-right .ar-name{ color:var(--blue); font-size:30px; font-weight:800; direction:rtl; }
.head-right .ar-sub{ font-size:12px; color:#333; direction:rtl; margin-top:4px; }
.head-mid{ text-align:center; color:var(--blue); font-weight:800; font-size:16px; letter-spacing:1px; margin-top:4px; }
.slogan-bar{
    width:100%; background:var(--blue); color:#fff; margin-top:8px;
    display:flex; justify-content:space-between; padding:6px 12px; font-weight:700; font-size:13px;
}
.slogan-bar span[dir=rtl]{ direction:rtl; }
