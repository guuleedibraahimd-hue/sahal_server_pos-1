<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1523">
<title>Live Orders · {{ restaurant_name }}</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
    --bg:#f3f5f9; --card:#fff; --text:#141a2a; --muted:#7c8598; --line:#e7eaf1;
    --dark:#0f1523; --blue:#2f6fed; --orange:#f59e0b; --green:#1f9e57; --red:#e0402e; --purple:#7b3fb5;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
button{font-family:inherit;}

.top{
    position:sticky;top:0;z-index:20;background:var(--dark);color:#fff;
    padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding-top:max(14px, env(safe-area-inset-top));
}
.back{color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.08);}
.title{flex:1;min-width:160px;}
.title h1{font-size:18px;font-weight:800;line-height:1.15;}
.title p{font-size:12px;color:rgba(255,255,255,.55);margin-top:2px;}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:800;background:rgba(31,158,87,.18);color:#4ade80;}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;animation:pulse 1.4s infinite;}
.pill.off{background:rgba(224,64,46,.2);color:#ff8a7a;}
.pill.off .dot{background:#ff8a7a;animation:none;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sound-btn{border:none;cursor:pointer;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font-weight:700;font-size:13px;}

.wrap{max-width:1300px;margin:0 auto;padding:16px;}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px;}
.stat{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.04);border-top:4px solid var(--blue);}
.stat .n{font-size:24px;font-weight:800;line-height:1.1;}
.stat .l{font-size:12px;color:var(--muted);font-weight:700;margin-top:3px;}
.stat.s-pending{border-color:var(--blue);} .stat.s-preparing{border-color:var(--orange);}
.stat.s-ready{border-color:var(--green);} .stat.s-unpaid{border-color:var(--red);} .stat.s-paid{border-color:var(--purple);}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-webkit-overflow-scrolling:touch;}
.tab{flex-shrink:0;border:1.5px solid var(--line);background:#fff;color:var(--text);padding:9px 15px;border-radius:20px;font-weight:800;font-size:13px;cursor:pointer;}
.tab.active{background:var(--dark);border-color:var(--dark);color:#fff;}
.tab .c{display:inline-block;min-width:20px;padding:1px 6px;margin-left:5px;border-radius:10px;background:rgba(0,0,0,.08);font-size:11.5px;}
.tab.active .c{background:rgba(255,255,255,.2);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}
.card{background:var(--card);border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.05);overflow:hidden;border-left:6px solid var(--blue);display:flex;flex-direction:column;}
.card[data-status="preparing"]{border-left-color:var(--orange);}
.card[data-status="ready"]{border-left-color:var(--green);}
.card[data-status="paid"]{border-left-color:var(--purple);opacity:.92;}
.card.late{box-shadow:0 0 0 2px rgba(224,64,46,.45);}
.card.flash{animation:flash 1.1s ease 3;}
@keyframes flash{50%{box-shadow:0 0 0 4px rgba(245,158,11,.6);}}
.c-head{display:flex;align-items:center;gap:12px;padding:14px 14px 10px;}
.tbl{width:54px;height:54px;border-radius:14px;background:var(--dark);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.tbl small{font-size:9px;font-weight:800;letter-spacing:1px;opacity:.7;}
.tbl b{font-size:20px;line-height:1;}
.tbl.ta{background:#c45f00;}
.tbl.ta b{font-size:22px;}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.split .sp{border-radius:14px;padding:14px;}
.split .sp.tb{background:#eef0fe;} .split .sp.ta{background:#fff1e0;}
.split .sp .l{font-size:12.5px;font-weight:800;}
.split .sp .n{font-size:22px;font-weight:800;margin-top:2px;}
.split .sp .s{font-size:12px;color:var(--muted);font-weight:700;}
.c-info{flex:1;min-width:0;}
.c-ref{font-weight:800;font-size:14.5px;}
.c-sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.status{padding:5px 11px;border-radius:20px;font-size:11.5px;font-weight:800;text-transform:capitalize;white-space:nowrap;}
.st-pending{background:#e8efff;color:var(--blue);}
.st-preparing{background:#fef3e2;color:#b86e00;}
.st-ready{background:#e3f6ec;color:#167a45;}
.st-paid{background:#f1e9fb;color:var(--purple);}
.items{list-style:none;padding:0 14px;flex:1;}
.items li{display:flex;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:14px;font-weight:600;}
.items li .q{color:var(--orange);font-weight:800;min-width:30px;}
.items li.new{color:#b86e00;}
.items li.new::after{content:"NEW";margin-left:auto;font-size:10px;font-weight:800;background:#fff3cd;color:#856404;padding:2px 7px;border-radius:8px;align-self:center;}
.c-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px 14px;margin-top:6px;border-top:1px solid var(--line);flex-wrap:wrap;}
.total{font-weight:800;font-size:17px;}
.age{font-size:12px;font-weight:700;color:var(--muted);}
.age.warn{color:var(--red);}
.links{display:flex;gap:6px;}
.links a{text-decoration:none;font-size:12px;font-weight:800;padding:7px 10px;border-radius:9px;background:#f1f3f7;color:var(--text);}
.empty{background:#fff;border-radius:16px;padding:50px 20px;text-align:center;color:var(--muted);font-weight:600;grid-column:1/-1;}
.empty .e{font-size:42px;margin-bottom:8px;}
.err{display:none;background:#fdecea;color:#b3261e;border-radius:12px;padding:12px 14px;font-weight:700;font-size:13px;margin-bottom:12px;}

@media (max-width:900px){ .stats{grid-template-columns:repeat(3,1fr);} }
@media (max-width:560px){
    .wrap{padding:12px;}
    .stats{grid-template-columns:repeat(2,1fr);gap:10px;}
    .stat .n{font-size:20px;}
    .grid{grid-template-columns:1fr;}
    .title h1{font-size:16px;}
}
</style>
<link rel="stylesheet" href="/static/sahal_app.css">
<link rel="manifest" href="/app_manifest/{{ rid }}/live.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/static/logo.png">
</head>
<body data-rid="{{ rid }}" data-role="admin" data-accent="#2f6fed">

<div class="top">
    <a class="back" href="{{ back_url }}">←</a>
    <div class="title">
        <h1>📡 Live Orders</h1>
        <p>{{ restaurant_name }}{% if is_super_admin %} · Super Admin{% endif %}</p>
    </div>
    <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔔 Sound: ON</button>
<button type="button" class="sa-notify-btn dark compact" data-sa-notify>🔕 Shid Notifications</button>
    <span class="pill" id="pill"><span class="dot"></span><span id="pillText">Live</span></span>
</div>

<div class="wrap">
    <div class="err" id="err"></div>

    <div class="stats">
        <div class="stat s-pending"><div class="n" id="stPending">0</div><div class="l">⏳ Pending</div></div>
        <div class="stat s-preparing"><div class="n" id="stPreparing">0</div><div class="l">👨‍🍳 Preparing</div></div>
        <div class="stat s-ready"><div class="n" id="stReady">0</div><div class="l">✅ Ready</div></div>
        <div class="stat s-unpaid"><div class="n" id="stUnpaid">$0.00</div><div class="l">💳 Unpaid (open)</div></div>
        <div class="stat s-paid"><div class="n" id="stPaid">$0.00</div><div class="l">💰 Paid today (<span id="stPaidCount">0</span>)</div></div>
    </div>

    <div class="split">
        <div class="sp tb"><div class="l">🪑 Table — maanta</div><div class="n" id="spTableAmt">$0.00</div><div class="s"><span id="spTableN">0</span> orders</div></div>
        <div class="sp ta"><div class="l">🥡 Take Away — maanta</div><div class="n" id="spTaAmt">$0.00</div><div class="s"><span id="spTaN">0</span> orders</div></div>
    </div>

    <div class="tabs" id="tabs">
        <button class="tab active" data-f="active">🔥 Active <span class="c" id="cActive">0</span></button>
        <button class="tab" data-f="pending">⏳ Pending <span class="c" id="cPending">0</span></button>
        <button class="tab" data-f="preparing">👨‍🍳 Preparing <span class="c" id="cPreparing">0</span></button>
        <button class="tab" data-f="ready">✅ Ready <span class="c" id="cReady">0</span></button>
        <button class="tab" data-f="takeaway">🥡 Take Away <span class="c" id="cTa">0</span></button>
        <button class="tab" data-f="paid">💰 Paid today <span class="c" id="cPaid">0</span></button>
    </div>

    <div class="grid" id="grid">
        <div class="empty"><div class="e">⏳</div>Loading…</div>
    </div>
</div>

<script>
const RID = {{ rid|tojson }};
let filter = "active";
let data = { active: [], paid_today: [], stats: {} };
let knownIds = null;
let lastVersion = null;
let soundOn = true;
try{ soundOn = localStorage.getItem("sahal_live_sound") !== "off"; }catch(e){}

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function money(n){ return "$" + (Number(n) || 0).toFixed(2); }

function toggleSound(){
    soundOn = !soundOn;
    try{ localStorage.setItem("sahal_live_sound", soundOn ? "on" : "off"); }catch(e){}
    document.getElementById("soundBtn").textContent = soundOn ? "🔔 Sound: ON" : "🔕 Sound: OFF";
    if(soundOn) ding();
}
document.getElementById("soundBtn").textContent = soundOn ? "🔔 Sound: ON" : "🔕 Sound: OFF";

let audioCtx = null;
function ding(){
    if(!soundOn) return;
    try{
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if(audioCtx.state === "suspended") audioCtx.resume();
        [880, 1175, 1568].forEach((f, i) => {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.frequency.value = f; const t = audioCtx.currentTime + i * 0.15;
            g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
            o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + 0.3);
        });
    }catch(e){}
}
document.addEventListener("click", () => { try{ if(audioCtx && audioCtx.state === "suspended") audioCtx.resume(); }catch(e){} });

document.getElementById("tabs").addEventListener("click", e => {
    const b = e.target.closest(".tab"); if(!b) return;
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    b.classList.add("active"); filter = b.dataset.f; render();
});

function setLive(ok, msg){
    document.getElementById("pill").classList.toggle("off", !ok);
    document.getElementById("pillText").textContent = ok ? "Live" : "Offline";
    const err = document.getElementById("err");
    err.style.display = ok ? "none" : "block";
    err.textContent = msg || "⚠️ Internet-ka ayaa go'ay — dib ayaan isugu xiraynaa…";
}

function card(o, flash){
    const late = o.status !== "paid" && o.age_min !== null && o.age_min >= 20 && o.status !== "ready";
    const newNames = new Set((o.new_items || []).map(i => i.name + "|" + i.qty));
    const oldCount = Math.max(0, o.items.length - (o.new_items || []).length);
    const items = o.items.map((it, idx) => {
        const isNew = idx >= oldCount && newNames.has(it.name + "|" + it.qty) && o.status !== "paid";
        return `<li class="${isNew ? "new" : ""}"><span class="q">${esc(it.qty)}×</span><span>${esc(it.name)}</span></li>`;
    }).join("") || `<li><span>${esc(o.items_text || "—")}</span></li>`;
    const age = o.age_min === null ? "" : (o.age_min < 1 ? "hadda" : (o.age_min < 60 ? `${o.age_min} min` : `${Math.floor(o.age_min/60)}h ${o.age_min%60}m`));
    const who = o.waiter ? `${o.staff_role === "cashier" ? "💰 Cashier" : "🧑‍🍳"} ${esc(o.waiter)}` : "📱 Customer QR";
    const tbl = o.order_type === "takeaway"
        ? `<div class="tbl ta"><small>TAKE</small><b>🥡</b></div>`
        : `<div class="tbl"><small>TABLE</small><b>${esc(o.table)}</b></div>`;
    const paidInfo = o.status === "paid" && o.payment_method ? ` · ${esc(o.payment_method.toUpperCase())}` : "";
    return `<div class="card${late ? " late" : ""}${flash ? " flash" : ""}" data-status="${esc(o.status)}">
        <div class="c-head">
            ${tbl}
            <div class="c-info">
                <div class="c-ref">#${esc(o.ref)}${o.order_type === "takeaway" ? " · Take Away" : ""}</div>
                <div class="c-sub">${who} · ${esc(o.time)}${paidInfo}</div>
            </div>
            <span class="status st-${esc(o.status)}">${esc(o.status)}</span>
        </div>
        <ul class="items">${items}</ul>
        <div class="c-foot">
            <div><div class="total">${money(o.total)}</div><div class="age${late ? " warn" : ""}">${late ? "⚠️ " : "🕐 "}${age}</div></div>
            <div class="links">
                <a href="/kitchen_ticket/${encodeURIComponent(RID)}/${encodeURIComponent(o.id)}?all=1" target="_blank">🍳 Ticket</a>
                <a href="/receipt/${encodeURIComponent(RID)}/${encodeURIComponent(o.id)}" target="_blank">🧾 Receipt</a>
            </div>
        </div>
    </div>`;
}

let flashIds = new Set();
function render(){
    const s = data.stats || {};
    document.getElementById("stPending").textContent = s.pending || 0;
    document.getElementById("stPreparing").textContent = s.preparing || 0;
    document.getElementById("stReady").textContent = s.ready || 0;
    document.getElementById("stUnpaid").textContent = money(s.active_amount);
    document.getElementById("stPaid").textContent = money(s.paid_today_amount);
    document.getElementById("stPaidCount").textContent = s.paid_today_count || 0;
    document.getElementById("cActive").textContent = data.active.length;
    document.getElementById("cPending").textContent = s.pending || 0;
    document.getElementById("cPreparing").textContent = s.preparing || 0;
    document.getElementById("cReady").textContent = s.ready || 0;
    document.getElementById("cPaid").textContent = data.paid_today.length;
    document.getElementById("cTa").textContent = data.active.filter(o => o.order_type === "takeaway").length;
    document.getElementById("spTableAmt").textContent = money(s.table_today_amount);
    document.getElementById("spTableN").textContent = s.table_today || 0;
    document.getElementById("spTaAmt").textContent = money(s.takeaway_today_amount);
    document.getElementById("spTaN").textContent = s.takeaway_today || 0;

    let list;
    if(filter === "paid") list = data.paid_today;
    else if(filter === "active") list = data.active;
    else if(filter === "takeaway") list = data.active.filter(o => o.order_type === "takeaway");
    else list = data.active.filter(o => o.status === filter);

    const grid = document.getElementById("grid");
    if(!list.length){
        grid.innerHTML = `<div class="empty"><div class="e">${filter === "paid" ? "💰" : "🍽️"}</div>${filter === "paid" ? "Wali lacag maanta lama qaadin." : "Hadda dalab furan ma jiro."}</div>`;
        return;
    }
    grid.innerHTML = list.map(o => card(o, flashIds.has(o.id))).join("");
}

let loading = false;
async function load(){
    if(loading) return; loading = true;
    try{
        const r = await fetch(`/api/live_orders/${encodeURIComponent(RID)}`, { cache:"no-store" });
        if(r.status === 401){ location.href = "/login"; return; }
        const d = await r.json();
        if(!d.success) throw new Error(d.error || "error");
        const ids = new Set(d.active.map(o => o.id));
        flashIds = new Set();
        if(knownIds){
            let isNew = false;
            d.active.forEach(o => {
                const prev = data.active.find(x => x.id === o.id);
                if(!knownIds.has(o.id) || (prev && (prev.new_items || []).length !== (o.new_items || []).length)){
                    flashIds.add(o.id); isNew = true;
                }
            });
            if(isNew){
                const f = d.active.find(o => flashIds.has(o.id)) || {};
                if(window.SahalApp && soundOn) SahalApp.newOrderAlert(`Dalab cusub — ${f.order_type === "takeaway" ? "Take Away" : "Table " + (f.table || "")}`, (f.items || []).map(i => i.qty + "× " + i.name).join(", "));
                else ding();
                document.title = "🔔 New order! · Live Orders"; setTimeout(() => document.title = "Live Orders · {{ restaurant_name|e }}", 4000); }
        }
        knownIds = ids;
        data = d; lastVersion = d.v;
        render(); setLive(true);
    }catch(e){
        setLive(false);
    }finally{ loading = false; }
}

async function checkVersion(){
    try{
        const r = await fetch(`/api/orders_version/${encodeURIComponent(RID)}`, { cache:"no-store" });
        if(r.status === 401){ location.href = "/login"; return; }
        const d = await r.json();
        if(!d.success) throw 0;
        setLive(true);
        if(lastVersion === null || d.v !== lastVersion) load();
    }catch(e){ setLive(false); }
}

load();
setInterval(checkVersion, 3000);
setInterval(load, 60000);                         // refresh ages / safety net
document.addEventListener("visibilitychange", () => { if(!document.hidden) load(); });
</script>
<script src="/static/sahal_app.js" defer></script>
</body>
</html>
