<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account Suspended</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#2c5364;
}

/* 🔥 OVERLAY */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    box-sizing:border-box;
}

/* 🔥 POPUP BOX */
.popup{
    background:white;
    width:100%;
    max-width:420px;
    padding:25px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    animation:fadeIn 0.3s ease;
}

.popup h2{ margin-top:0; }

.biz-name{ font-weight:bold; color:#111; }

/* CODE */
.code{
    font-size:20px;
    color:#0a7cff;
    margin:20px 0;
    font-weight:bold;
    background:#f1f5ff;
    padding:12px;
    border-radius:10px;
    letter-spacing:1px;
}

/* FORM */
.renew-form{ text-align:left; margin-top:16px; display:none; }
.renew-form.show{ display:block; }
.renew-form label{ font-size:12px; font-weight:bold; color:#555; display:block; margin-bottom:4px; }
.renew-form input{
    width:100%; padding:12px; border-radius:10px; border:1px solid #ccc;
    margin-bottom:14px; box-sizing:border-box; font-size:14px;
}

/* BUTTON */
.btn{
    padding:12px;
    width:100%;
    border:none;
    border-radius:10px;
    font-size:15px;
    cursor:pointer;
    margin-top:10px;
    font-weight:bold;
}

.pay{ background:#28a745; color:white; }
.check{ background:#0a7cff; color:white; }
.close{ background:#dc3545; color:white; }

.status-msg{ margin-top:14px; font-size:13px; font-weight:bold; display:none; padding:10px; border-radius:8px; }
.status-msg.error{ background:#f8d7da; color:#721c24; display:block; }
.status-msg.success{ background:#d4edda; color:#155724; display:block; }

/* ANIMATION */
@keyframes fadeIn{
    from{opacity:0; transform:scale(0.8);}
    to{opacity:1; transform:scale(1);}
}
</style>

</head>

<body>

<div class="overlay" id="popup">

<div class="popup" id="popupBox">

<h2>⛔ Account Suspended</h2>

<p>
The <b>{{ entity_label }}</b> account "<span class="biz-name">{{ business_name }}</span>" has been temporarily suspended by admin.<br>
Fadlan lacagta u dir lambarka hoose, kadibna buuxi foomka si loo dib-u-daayo (renew) system-ka.
</p>

<div class="code">
📲 Send payment to: {{ payment_number }}
</div>

<button class="btn pay" id="showFormBtn" onclick="showRenewForm()">
💳 I've Paid — Confirm Renewal
</button>

<form class="renew-form" id="renewForm" onsubmit="return false;">
    <label>Your Name *</label>
    <input type="text" id="sender_name" placeholder="Full name on the sending account" autocomplete="off">

    <label>Number You Paid From *</label>
    <input type="text" id="paid_from_number" placeholder="e.g. 0612345678" autocomplete="off">

    <button class="btn check" onclick="checkRenew()">
        ✅ Submit Renewal Request
    </button>
</form>

<div class="status-msg" id="statusMsg"></div>

<button class="btn close" onclick="logoutNow()">
Logout
</button>

</div>

</div>

<script>
const ENTITY_TYPE    = "{{ entity_type }}";
const ENTITY_ID      = "{{ entity_id }}";
const LOGOUT_URL     = "{{ logout_url }}";

function showRenewForm(){
    document.getElementById("renewForm").classList.add("show");
    document.getElementById("showFormBtn").style.display = "none";
}

async function checkRenew(){
    const sender_name      = document.getElementById("sender_name").value.trim();
    const paid_from_number = document.getElementById("paid_from_number").value.trim();
    const msg = document.getElementById("statusMsg");
    msg.className = "status-msg";

    if(!sender_name || !paid_from_number){
        msg.classList.add("error");
        msg.textContent = "❌ Please fill in both fields";
        return;
    }

    try{
        let res = await fetch(`/submit_renewal/${ENTITY_TYPE}/${ENTITY_ID}`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ sender_name, paid_from_number })
        });
        let data = await res.json();

        if(data.success){
            msg.classList.add("success");
            msg.textContent = "✅ Renewal request sent! Admin will review and reactivate your account shortly.";
            document.getElementById("renewForm").classList.remove("show");
        } else {
            msg.classList.add("error");
            msg.textContent = "❌ " + (data.error || "Something went wrong");
        }
    }catch(e){
        msg.classList.add("error");
        msg.textContent = "❌ Server error, please try again";
    }
}

function logoutNow(){
    window.location.href = LOGOUT_URL;
}
</script>

</body>
</html>
