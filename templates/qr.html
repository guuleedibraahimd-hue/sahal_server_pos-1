<!DOCTYPE html>
<html>
<head>
    <title>QR Code</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
    body{
        font-family:Arial, sans-serif;
        text-align:center;
        background:#f0f2f8;
        padding:40px 20px;
        margin:0;
    }

    /* ── QR Card ── */
    .card{
        background:white;
        border-radius:20px;
        display:inline-block;
        box-shadow:0 8px 32px rgba(0,0,0,0.13);
        max-width:420px;
        width:100%;
        overflow:hidden;
        padding-bottom:28px;
    }

    /* ── Header gradient ── */
    .card-header{
        background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
        padding: 38px 20px 60px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* food-dome icon circle */
    .logo-circle{
        width: 80px;
        height: 80px;
        background: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    }

    .logo-circle svg{
        width: 44px;
        height: 44px;
        fill: #2563eb;
    }

    /* ── Body ── */
    .card-body{
        padding: 0 28px;
    }

    .restaurant-name{
        font-size: 22px;
        font-weight: 800;
        color: #1e3a8a;
        margin: 24px 0 4px;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    .restaurant-tagline{
        font-size: 13px;
        color: #64748b;
        font-style: italic;
        margin: 0 0 20px;
    }

    /* dashed separator */
    .separator{
        border: none;
        border-top: 2px dashed #cbd5e1;
        margin: 18px 0;
    }

    /* table badge */
    .table-badge-wrapper{
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin-bottom: 18px;
    }

    .leaf-svg{
        width: 28px;
        opacity: 0.45;
    }

    .table-badge{
        background: #eff6ff;
        border: 1.5px solid #bfdbfe;
        border-radius: 14px;
        padding: 10px 28px;
        text-align: center;
    }

    .table-label{
        font-size: 11px;
        font-weight: 700;
        color: #2563eb;
        letter-spacing: 2px;
        text-transform: uppercase;
        display: block;
    }

    .table-number{
        font-size: 40px;
        font-weight: 900;
        color: #2563eb;
        line-height: 1;
        display: block;
    }

    /* QR image box */
    .qr-box{
        border: 2px solid #93c5fd;
        border-radius: 16px;
        padding: 14px;
        display: inline-block;
        background: white;
        box-shadow: 0 2px 12px rgba(37,99,235,0.09);
    }

    #qrimg{
        width: 220px;
        height: 220px;
        max-width: 100%;
        object-fit: contain;
        image-rendering: pixelated;
        display: block;
    }

    /* scan hint */
    .scan-hint{
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 16px 0 20px;
        color: #475569;
        font-size: 13px;
    }

    .scan-hint-icon{
        width: 34px;
        height: 34px;
        background: #eff6ff;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .scan-hint-icon svg{
        width: 18px;
        height: 18px;
        fill: #2563eb;
    }

    .scan-hint-text{
        text-align: left;
    }

    .scan-hint-text strong{
        display: block;
        color: #1e293b;
        font-size: 14px;
    }

    /* Payment methods */
    .payment-methods-box{
        text-align: left;
        margin: 6px 0 20px;
    }
    .pm-title{
        font-size: 13px;
        font-weight: 800;
        color: #1e293b;
        margin-bottom: 8px;
    }
    .pm-line{
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 8px 12px;
        margin-bottom: 6px;
        font-size: 13px;
    }
    .pm-type{
        font-weight: 700;
        color: #2563eb;
    }
    .pm-code{
        font-weight: 600;
        color: #334155;
        font-family: monospace;
    }

    /* Buttons */
    .btn-row{
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 6px;
    }

    .btn{
        padding: 11px 18px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        color: white;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex: 1;
        min-width: 110px;
        justify-content: center;
        transition: opacity .18s;
    }

    .btn:hover{ opacity: .88; }

    .download{ background: #22c55e; }
    .print   { background: #f59e0b; }
    .close   { background: #ec4899; }

    /* close button below card */
    .close-btn{
        margin-top: 22px;
        display: inline-block;
        color: #64748b;
        font-size: 14px;
        cursor: pointer;
        background: none;
        border: none;
    }

    </style>
</head>

<body>

<div class="card">

    <!-- Header -->
    <div class="card-header">
        <div class="logo-circle">
            <!-- Food dome SVG -->
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 36 Q10 18 32 18 Q54 18 54 36 Z"/>
                <rect x="8" y="36" width="48" height="4" rx="2"/>
                <rect x="28" y="40" width="8" height="6" rx="1"/>
                <rect x="20" y="46" width="24" height="3" rx="1.5"/>
                <!-- stars -->
                <text x="24" y="58" font-size="8" fill="#2563eb">★ ★ ★</text>
            </svg>
        </div>
    </div>

    <!-- Body -->
    <div class="card-body">

        <div class="restaurant-name">{{ restaurant }}</div>
        <div class="restaurant-tagline">— Delicious food, great experience —</div>

        <hr class="separator">

        <!-- Table badge -->
        <div class="table-badge-wrapper">
            <!-- leaf left -->
            <svg class="leaf-svg" viewBox="0 0 40 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 55 C20 55 5 40 8 22 C11 8 20 5 20 5 C20 5 29 8 32 22 C35 40 20 55 20 55Z" fill="#93c5fd"/>
                <line x1="20" y1="55" x2="20" y2="5" stroke="#60a5fa" stroke-width="1.5"/>
            </svg>

            <div class="table-badge">
                <span class="table-label">Table</span>
                <span class="table-number">{{ table }}</span>
            </div>

            <!-- leaf right (mirrored) -->
            <svg class="leaf-svg" viewBox="0 0 40 60" fill="none" xmlns="http://www.w3.org/2000/svg" style="transform:scaleX(-1)">
                <path d="M20 55 C20 55 5 40 8 22 C11 8 20 5 20 5 C20 5 29 8 32 22 C35 40 20 55 20 55Z" fill="#93c5fd"/>
                <line x1="20" y1="55" x2="20" y2="5" stroke="#60a5fa" stroke-width="1.5"/>
            </svg>
        </div>

        <hr class="separator">

        <!-- QR Image -->
        <div class="qr-box">
            <img id="qrimg"
                 src="/static/qr/{{ img }}"
                 alt="QR Code">
        </div>

        <!-- Scan hint -->
        <div class="scan-hint">
            <div class="scan-hint-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17 1H7C5.9 1 5 1.9 5 3v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm-5 20c-.83 0-1.5-.67-1.5-1.5S11.17 18 12 18s1.5.67 1.5 1.5S12.83 21 12 21zm5-4H7V4h10v13z"/>
                </svg>
            </div>
            <div class="scan-hint-text">
                <strong>Scan to view our menu</strong>
                Thank you for dining with us! ♥
            </div>
        </div>

        {% if payment_methods %}
        <hr class="separator">
        <div class="payment-methods-box">
            <div class="pm-title">💳 We Accept</div>
            {% for m in payment_methods %}
            <div class="pm-line"><span class="pm-type">{{ m.type }}</span><span class="pm-code">{{ m.code }}</span></div>
            {% endfor %}
        </div>
        {% endif %}
        <!-- Machine-readable copy for the OUTER dashboard pages' printQR()
             (they inject only this card's markup via innerHTML, so their
             own JS reads payment data from here rather than duplicating
             Jinja rendering logic in JS). -->
        <script type="application/json" id="paymentMethodsData">{{ payment_methods|default([])|tojson }}</script>

        <!-- Buttons -->
        <div class="btn-row">
            <a href="/static/qr/{{ img }}" download class="btn download">
                ⬇ Download QR
            </a>
            <button class="btn print" onclick="printQR('a4')">
                🖨 Print A4
            </button>
            <button class="btn print" onclick="printQR('a5')">
                🖨 Print A5
            </button>
            <button class="btn print" onclick="printQR('a6')">
                🖨 Print A6
            </button>
            <button class="btn print" onclick="printQR('a7')">
                🖨 Print A7
            </button>
            <button class="btn print" onclick="printQR('receipt')">
                🧾 Print Receipt
            </button>
            <button class="btn close" onclick="closeQRResult()">
                ✕ Close
            </button>
        </div>

    </div>
</div>

<br>
<button class="close-btn" onclick="closeQRResult()">Close</button>

<script>
function printQR(format){
    const img = document.getElementById("qrimg").src;
    const restaurantName = {{ restaurant|tojson }};
    const tableNo = {{ table|tojson }};
    const w = window.open("", "_blank");

    const paymentMethods = (() => {
        try{
            const el = document.getElementById("paymentMethodsData");
            return el ? JSON.parse(el.textContent) : [];
        }catch(e){ return []; }
    })();

    if(format === "receipt"){
        const pmHtml = paymentMethods.length ? `
                <div style="border-top:1px dashed #999;margin:8px 0;"></div>
                <div style="font-size:11px;font-weight:700;margin-bottom:4px;">💳 WE ACCEPT</div>
                ${paymentMethods.map(m => `<div style="font-size:11px;display:flex;justify-content:space-between;padding:2px 0;"><span>${m.type}</span><span>${m.code}</span></div>`).join("")}
        ` : "";

        // Narrow thermal-receipt-width layout (~80mm)
        w.document.write(`
            <html>
            <head><title>Table QR</title></head>
            <body style="font-family:Arial;text-align:center;width:280px;margin:20px auto;padding:0;">
                <div style="font-weight:900;font-size:16px;">${restaurantName}</div>
                <div style="font-size:12px;color:#555;margin:4px 0 10px;">— Delicious food, great experience —</div>
                <div style="border-top:1px dashed #999;margin:8px 0;"></div>
                <div style="font-size:13px;font-weight:700;">TABLE</div>
                <div style="font-size:28px;font-weight:900;margin:2px 0 10px;">${tableNo}</div>
                <img src="${img}" style="width:220px;height:220px;">
                <div style="font-size:12px;font-weight:700;margin-top:10px;">Scan to view our menu</div>
                ${pmHtml}
                <div style="border-top:1px dashed #999;margin:10px 0;"></div>
                <div style="font-size:10px;color:#888;">Powered by Sahal Server</div>
                <script>
                    window.onload=function(){
                        window.print();
                        window.close();
                    }
                <\/script>
            </body>
            </html>
        `);
    } else {
        // A4 / A5 / A6 / A7 — same card design, proportionally scaled
        // down for each paper size (an A7 sheet is ~74x105mm, so the
        // A4 card's sizes would badly overflow it unscaled).
        const sizes = {
            a4: { page: "A4",  box: 420, pad: "32px 28px", nameSize: 26, tagSize: 14, tagline: true, tableLabel: 14, tableNum: 46, qr: 300, hintSize: 15, hint2: 12, gap: 18, pmSize: 12 },
            a5: { page: "A5",  box: 300, pad: "22px 18px", nameSize: 19, tagSize: 12, tagline: true, tableLabel: 12, tableNum: 32, qr: 190, hintSize: 12, hint2: 10, gap: 12, pmSize: 11 },
            a6: { page: "A6",  box: 200, pad: "14px 12px", nameSize: 14, tagSize: 10, tagline: false, tableLabel: 10, tableNum: 22, qr: 120, hintSize: 10, hint2: 9,  gap: 8,  pmSize: 9  },
            a7: { page: "A7",  box: 135, pad: "9px 8px",   nameSize: 10, tagSize: 8,  tagline: false, tableLabel: 8,  tableNum: 15, qr: 78,  hintSize: 8,  hint2: 7,  gap: 5,  pmSize: 0  }
        };
        const s = sizes[format] || sizes.a4;

        // A7 is too small to fit payment details legibly, same reason
        // the "thank you" line is already dropped for it.
        const pmHtml = (paymentMethods.length && s.pmSize) ? `
                    <div style="border-top:1px dashed #bbb;margin:${s.gap}px 0;"></div>
                    <div style="font-size:${s.pmSize}px;font-weight:800;color:#1e293b;margin-bottom:4px;">💳 WE ACCEPT</div>
                    ${paymentMethods.map(m => `<div style="font-size:${s.pmSize}px;display:flex;justify-content:space-between;max-width:${s.box-40}px;margin:0 auto 2px;"><span style="font-weight:700;color:#2563eb;">${m.type}</span><span style="font-family:monospace;">${m.code}</span></div>`).join("")}
        ` : "";

        w.document.write(`
            <html>
            <head>
                <title>Table QR</title>
                <style>@page { size: ${s.page}; margin: 8mm; }</style>
            </head>
            <body style="font-family:Arial;text-align:center;margin:0;padding:${format==='a4'?'60px 20px':'10px'};">
                <div style="max-width:${s.box}px;margin:0 auto;border:1.5px solid #dbe4ff;border-radius:${Math.round(s.box/21)}px;padding:${s.pad};box-shadow:0 8px 24px rgba(0,0,0,0.08);">
                    <div style="font-weight:900;font-size:${s.nameSize}px;color:#1e3a8a;">${restaurantName}</div>
                    ${s.tagline ? `<div style="font-size:${s.tagSize}px;color:#555;font-style:italic;margin:6px 0 ${s.gap}px;">— Delicious food, great experience —</div>` : `<div style="margin-bottom:${s.gap}px;"></div>`}
                    <div style="border-top:1px dashed #bbb;margin:${s.gap}px 0;"></div>
                    <div style="font-size:${s.tableLabel}px;font-weight:700;color:#2563eb;">TABLE</div>
                    <div style="font-size:${s.tableNum}px;font-weight:900;color:#1e3a8a;margin:2px 0 ${s.gap}px;">${tableNo}</div>
                    <div style="border-top:1px dashed #bbb;margin:${s.gap}px 0;"></div>
                    <img src="${img}" style="width:${s.qr}px;height:${s.qr}px;">
                    <div style="font-size:${s.hintSize}px;font-weight:700;margin-top:${s.gap}px;">📱 Scan to view our menu</div>
                    ${format !== 'a7' ? `<div style="font-size:${s.hint2}px;color:#888;margin-top:4px;">Thank you for dining with us! ♥</div>` : ''}
                    ${pmHtml}
                </div>
                <script>
                    window.onload=function(){
                        window.print();
                        window.close();
                    }
                <\/script>
            </body>
            </html>
        `);
    }
    w.document.close();
}

/* This markup gets used two ways: (1) fetched as HTML text and injected
   into a dashboard's #qrResult div via innerHTML — in which case this
   whole <script> block never actually runs (browsers don't execute
   <script> tags inserted that way), so the onclick just resolves to
   whatever printQR/closeQRResult the OUTER page already defined —
   or (2) loaded directly as its own page, in which case THIS script
   is what runs and needs a real fallback. Covering both here. */
function closeQRResult(){
    window.location.href="/dashboard/{{ rid }}";
}
</script>

</body>
</html>
